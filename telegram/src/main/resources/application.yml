spring:
  profiles:
    active: ${PROFILES:}

feature:
  service-fee:
    description: |
      Game calculation fee. 
      Link below
    enabled: true
    url: https://buymeacoffee.com/mrrockka
    percent: 5
    threshold: 5

bot:
  properties:
    name: ${BOT_NAME:Poker calculator bot}
    nickname: ${BOT_NICKNAME:bot}
    enabled: ${BOT_ENABLED:false}
    token: ${BOT_TOKEN:}
  scheduler:
    cron: "0 * * * * *"
  description:
    commands:
      - name: game
        enabled: true
        description: Bot conversation to start a game
        details: |
          You will be asked to input parameters of the game you want to start.
          
          There are three types of games that are supported: Tournament, Cash and Bounty tournament.
          
          In order to start a game you should specify a type, buy in, bounty if applicable and players.
          Also if you are aware of automatic poll creation feature `/create_poll` then you can have poll as a reply message when bot will ask about players so all the people that answered `participant` option will be added to game automatically. 
          
          For the re-entries and new players `/entry @me` could be used, for tournaments buy in will be game buy in as default, for cash games you could specify the number in this message which will be used instead of default.
          
          For all tournaments in order to calculate payouts finale places and prize pool should be specified.
          
          And after all set you can call `/calculate` command to see game summary and all the calculations.
      - name: entry
        enabled: true
        description: Player entry to game
        details: |
          For players reentries or new players entry use /entry command with nickname to save it against the last started game.
          You could specify multiple players and amount of buy-in which is useful for cash game with not strict max buy-in amount.
          You could forward game message in case there are multiple games happen in parallel to store against it.
          Examples: 
          /entry @nickname
          /entry @nickname 20 
          /entry @nickname @nickname
          /entry @nickname @nickname 20
      - name: bounty
        enabled: true
        description: Bounty transaction in game
        details: |
          When one player kicks another, the one who kick gets bounty chip, to make it happen use /bounty command with bounty transaction between players which will be executed against the last started BOUNTY game.
          Message should contain person who kicked, keyword and person who was kicked. 
          You could forward game message in case there are multiple games happen in parallel to store against it.
          Examples: 
          /bounty @nickname kicked @nickname
      - name: withdrawal
        enabled: true
        description: Player withdrawal from a cash game
        details: |
          For players withdrawals use /withdrawal command with nickname and amount to save it against the last started game.
          You could specify multiple players with same withdrawal amount.
          You could forward game message in case there are multiple games happen in parallel to store against it.
          Examples: 
          /withdrawal @nickname 20
          /withdrawal @nickname @nickname 20
      - name: prize_pool
        enabled: true
        details: |
          You will be asked about details for game's prize pool
      - name: finale_places
        enabled: true
        description: Stores a finale places for a tournament
        details: |
          You will asked about details for game's winners
      - name: calculate
        enabled: true
        description: Calculate game payouts
        details: |
          When game is over you could use /calculate command to view calculated payouts.
          You could forward game message in case there are multiple games happen in parallel to store against it.
          Information needed to calculate:
          - Tournament: 
            - prize pool
            - finale places
          - Bounty Tournament: 
            - prize pool
            - finale places
            - bounties 
          - Cash game:
            - withdrawals
          Examples: 
          /calculate
      - name: game_stats
        enabled: true
        description: Game statistics
        details: |
          When you want to see game statistics you could use /game_stats command.
          You could forward game message in case there are multiple games happen in parallel to store against it.
          Examples: 
          /game_stats
      - name: player_stats
        enabled: true
        description: Player in game statistics
        details: |
          When you want to see your statistics as player in game you could use /player_stats command.
          You could forward game message in case there are multiple games happen in parallel to select against it.
          Examples: 
          /player_stats
      - name: my_stats
        enabled: true
        description: Person chat statistics
        details: |
          When you want to see your chat statistics for all the games you were into you could use /my_stats command.
          Examples: 
          /my_stats
      - name: help
        enabled: true
        description: Post it with a command name for command details
        details: |
          You could use `/help` command to get details about supported commands.
          And you can try start a poker manager for game with `/game` command or type `/help game` to get details about it
      - name: start
        enabled: true
        details: |
          Hey nice to see you. 
          This bot is designed to manage offline poker games in an easy manner and payouts calculation for each player.
          It supports tournaments and cash games calculation.
          
          Also if your game depends on number of players there is a command to create a scheduled automatic poll which later can be used as a player reference for game creation.
          
          You could use `/help` command to get details about supported commands.
          And you can try start a poker manager for game with `/game` command or type `/help game` to get details about it
      - name: create_poll
        enabled: true
        description: Created a scheduled poll with specific message and repeat time for chat
        details: |
          You could use this command to scheduled a poll for chat.
          Cron field and options field are required ones.
          Cron is default cron format starting from seconds to year. (Sec Min Hour Day-of-month Month Day-of-week) 
          For options you can mark one of it with "participant" keyword to make it an option to start game with (all answered this options would be used to create a game).
          Examples: 
          /create_poll
          cron: 40 59 10 1-7 JAN MON-TUE
          message: Example message
          options:
          1. Yes 
          /create_poll
          cron: * 00 17 * * MON
          message: Example message
          options:
          1. Yes - participant
          2. No
          3. Maybe
      - name: stop_poll
        enabled: true
        description: Stops already created scheduled poll
        details: |
          You could use this command to stop already created scheduled a poll for chat.
          You should reply to poll creation message in order to do that.
          Examples: 
          /stop_poll
      - name: cancel
        enabled: true
        description: Cancel players in game actions by message
        details: |
          You should reply to message you want to cancel with this command to process it.
          Actions that could be canceled:
          - entry
          - withdrawal
          - bounty
